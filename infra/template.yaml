AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Optional DBLA derived-feature AWS pipeline

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256

Resources:
  TrainingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SessionEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  RiskTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dbla-risk-events

  DerivedEventsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1

  DerivedEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../server/
      Handler: aws.lambda_handler.handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref SessionEventsTable
          SNS_TOPIC_ARN: !Ref RiskTopic
          AWS_REGION: !Ref AWS::Region
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionEventsTable
        - S3WritePolicy:
            BucketName: !Ref TrainingBucket
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref RiskTopic
      Events:
        Batch:
          Type: Api
          Properties:
            RestApiId: !Ref DerivedEventsApi
            Path: /events
            Method: post

Outputs:
  ApiEndpoint:
    Value: !Sub https://${DerivedEventsApi}.execute-api.${AWS::Region}.amazonaws.com/v1/events
  TrainingBucket:
    Value: !Ref TrainingBucket
  SessionEventsTable:
    Value: !Ref SessionEventsTable
  RiskTopicArn:
    Value: !Ref RiskTopic
